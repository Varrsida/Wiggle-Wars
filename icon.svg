<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A2387"/>
      <stop offset="50%" stop-color="#E94057"/>
      <stop offset="100%" stop-color="#F27121"/>
    </linearGradient>
    <linearGradient id="face" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="100%" stop-color="#FFD13B"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded Card -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  
  <!-- Outer Glow Ring -->
  <circle cx="64" cy="64" r="46" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.4"/>
  
  <!-- Smiling Face Character -->
  <circle cx="64" cy="64" r="38" fill="url(#face)"/>
  
  <!-- Eyes -->
  <ellipse cx="50" cy="54" rx="5" ry="7" fill="#2E1065"/>
  <ellipse cx="78" cy="54" rx="5" ry="7" fill="#2E1065"/>
  <circle cx="48" cy="52" r="2" fill="#FFFFFF"/>
  <circle cx="76" cy="52" r="2" fill="#FFFFFF"/>
  
  <!-- Big Cheeky Smile -->
  <path d="M 46 68 Q 64 90 82 68" fill="none" stroke="#2E1065" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Rosy Cheeks -->
  <circle cx="42" cy="68" r="6" fill="#FF5252" opacity="0.6"/>
  <circle cx="86" cy="68" r="6" fill="#FF5252" opacity="0.6"/>
  
  <!-- Sparkles -->
  <polygon points="64,12 67,20 75,23 67,26 64,34 61,26 53,23 61,20" fill="#FFF" opacity="0.9"/>
  <polygon points="106,40 108,45 113,47 108,49 106,54 104,49 99,47 104,45" fill="#00FFFF" opacity="0.9"/>
</svg>
